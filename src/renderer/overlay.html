<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hey Jave Screen Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
      user-select: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* ── Border Glow ──────────────────────────────────────────────────────── */
    .screen-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 0;
      opacity: 0;
      transition: opacity 0.4s ease;
      box-shadow: inset 0 0 25px 6px rgba(66,133,244,0.85),
                  inset 0 0 50px 12px rgba(234,67,53,0.45);
    }
    .screen-glow.active {
      opacity: 1;
      animation: screen-pulse 2s ease-in-out infinite alternate;
    }
    @keyframes screen-pulse {
      0%   { box-shadow: inset 0 0 25px 6px rgba(66,133,244,0.9),  inset 0 0 55px 14px rgba(52,168,83,0.5); }
      50%  { box-shadow: inset 0 0 30px 8px rgba(251,188,4,0.9),   inset 0 0 65px 16px rgba(234,67,53,0.5); }
      100% { box-shadow: inset 0 0 25px 6px rgba(234,67,53,0.9),   inset 0 0 55px 14px rgba(66,133,244,0.5); }
    }

    /* ── Status Pill ─────────────────────────────────────────────────────── */
    .status-pill {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(12,15,23,0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(66,133,244,0.4);
      color: #f0f0f0;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.6);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .screen-glow.active .status-pill { opacity: 1; }
    .pulse-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4285f4;
      animation: dot-glow 1s infinite alternate;
      flex-shrink: 0;
    }
    @keyframes dot-glow {
      from { background: #4285f4; transform: scale(0.9); }
      to   { background: #ea4335; transform: scale(1.25); }
    }
    .prompt-text {
      max-width: 450px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e2e8f0;
    }

    /* ── Listening Ring (Wake Word Active) ───────────────────────────────── */
    #listen-ring {
      position: absolute;
      bottom: 32px;
      right: 32px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(66,133,244,0.95) 0%, rgba(66,133,244,0.2) 60%, transparent 100%);
      box-shadow: 0 0 32px 8px rgba(66,133,244,0.6);
      display: none;
      animation: pulse-ring 1.1s ease-in-out infinite;
      pointer-events: none;
    }
    #listen-ring.active { display: block; }
    @keyframes pulse-ring {
      0%   { transform: scale(0.85); opacity: 0.9; }
      50%  { transform: scale(1.2);  opacity: 0.5; }
      100% { transform: scale(0.85); opacity: 0.9; }
    }

    /* ── Highlight Boxes Layer ───────────────────────────────────────────── */
    #box-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .hbox {
      position: absolute;
      border: 3px solid;
      border-radius: 6px;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      animation: box-pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .hbox.green  { border-color: #34a853; box-shadow: 0 0 16px rgba(52,168,83,0.6);  }
    .hbox.red    { border-color: #ea4335; box-shadow: 0 0 16px rgba(234,67,53,0.6);  }
    .hbox.yellow { border-color: #fbbc04; box-shadow: 0 0 16px rgba(251,188,4,0.6);  }
    .hbox.blue   { border-color: #4285f4; box-shadow: 0 0 16px rgba(66,133,244,0.6); }
    @keyframes box-pop-in {
      from { opacity: 0; transform: scale(0.8); }
      to   { opacity: 1; transform: scale(1);   }
    }
    .hbox-tag {
      position: absolute;
      top: -26px;
      left: 0;
      background: rgba(12,15,23,0.92);
      backdrop-filter: blur(8px);
      color: #f0f0f0;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px 4px 0 0;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hbox-close {
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      padding: 0 2px;
      pointer-events: auto;
    }
    .hbox-close:hover { color: #ea4335; }

    /* ── ScreenPad ───────────────────────────────────────────────────────── */
    #screenpad {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      min-width: 420px;
      max-width: 680px;
      background: rgba(10,13,22,0.96);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(66,133,244,0.35);
      border-radius: 14px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.04);
      color: #e2e8f0;
      font-size: 13px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      pointer-events: auto;
      animation: pad-slide-up 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #screenpad.visible { display: flex; }
    @keyframes pad-slide-up {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0);    }
    }
    .sp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      gap: 8px;
    }
    .sp-title {
      font-size: 12px;
      font-weight: 600;
      color: #93c5fd;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sp-close-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 0 4px;
      border-radius: 4px;
      pointer-events: auto;
      transition: color 0.15s, background 0.15s;
    }
    .sp-close-btn:hover { color: #ea4335; background: rgba(234,67,53,0.1); }
    .sp-content {
      padding: 12px 14px;
      font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
      font-size: 12.5px;
      color: #a5f3fc;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 280px;
      overflow-y: auto;
      line-height: 1.6;
    }
    .sp-content::-webkit-scrollbar { width: 4px; }
    .sp-content::-webkit-scrollbar-track { background: transparent; }
    .sp-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
    .sp-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .sp-btn {
      background: rgba(66,133,244,0.15);
      border: 1px solid rgba(66,133,244,0.3);
      color: #93c5fd;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.15s, border-color 0.15s;
    }
    .sp-btn:hover { background: rgba(66,133,244,0.3); border-color: rgba(66,133,244,0.6); }
    .sp-btn.confirm {
      background: rgba(52,168,83,0.15);
      border-color: rgba(52,168,83,0.3);
      color: #86efac;
    }
    .sp-btn.confirm:hover { background: rgba(52,168,83,0.3); }
    .sp-btn-hidden { display: none; }
  </style>
</head>
<body>

  <!-- ── Border Glow ──────────────────────────────────────────────────────── -->
  <div id="glow" class="screen-glow">
    <div class="status-pill">
      <div class="pulse-dot"></div>
      <span id="status-text" class="prompt-text">⚡ Hey Jave AI Agent Active on Windows Desktop...</span>
    </div>
  </div>

  <!-- ── Listening Ring ─────────────────────────────────────────────────── -->
  <div id="listen-ring"></div>

  <!-- ── Highlight Boxes Layer ──────────────────────────────────────────── -->
  <div id="box-layer"></div>

  <!-- ── ScreenPad ──────────────────────────────────────────────────────── -->
  <div id="screenpad">
    <div class="sp-header">
      <span class="sp-title">
        📋 <span id="sp-title-text">AI Suggestion</span>
      </span>
      <button class="sp-close-btn" id="sp-close" title="Close ScreenPad">✕</button>
    </div>
    <pre class="sp-content" id="sp-content"></pre>
    <div class="sp-actions">
      <button class="sp-btn" id="sp-copy">📋 Copy</button>
      <button class="sp-btn confirm sp-btn-hidden" id="sp-confirm">✅ Confirm &amp; Save</button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    // ── Helpers ──────────────────────────────────────────────────────────────
    const glow       = document.getElementById('glow');
    const statusText = document.getElementById('status-text');
    const listenRing = document.getElementById('listen-ring');
    const boxLayer   = document.getElementById('box-layer');
    const screenpad  = document.getElementById('screenpad');

    // ── Border Glow ──────────────────────────────────────────────────────────
    ipcRenderer.on('overlay:show', (_e, promptText) => {
      statusText.textContent = promptText
        ? `⚡ Hey Jave: ${promptText}`
        : `⚡ Hey Jave AI Agent Active on Windows Desktop...`;
      glow.classList.add('active');
    });
    ipcRenderer.on('overlay:hide', () => {
      glow.classList.remove('active');
    });
    ipcRenderer.on('overlay:update', (_e, stepThought) => {
      if (stepThought) statusText.textContent = `⚡ Hey Jave: ${stepThought}`;
    });

    // ── Listening Ring (Wake Word) ───────────────────────────────────────────
    ipcRenderer.on('agent:listen-start', () => listenRing.classList.add('active'));
    ipcRenderer.on('agent:listen-stop',  () => listenRing.classList.remove('active'));

    // ── TTS via Web Speech API (Windows built-in, no Azure key needed) ───────
    ipcRenderer.on('agent:tts-speak', (_e, data) => {
      const text = typeof data === 'string' ? data : data?.text;
      if (!text) return;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate  = 0.95;
      utterance.pitch = 1.0;
      const setVoice = () => {
        const voices  = speechSynthesis.getVoices();
        const msVoice = voices.find(v =>
          v.name.toLowerCase().includes('microsoft') &&
          v.name.toLowerCase().includes('david')
        );
        utterance.voice = msVoice ?? voices.find(v => v.lang.startsWith('en')) ?? null;
        speechSynthesis.cancel();
        speechSynthesis.speak(utterance);
      };
      speechSynthesis.getVoices().length > 0
        ? setVoice()
        : speechSynthesis.addEventListener('voiceschanged', setVoice, { once: true });
    });

    // ── Highlight Boxes ──────────────────────────────────────────────────────
    ipcRenderer.on('overlay:box-show', (_e, box) => {
      // Remove existing box with same id
      const old = document.getElementById(`hbox_${box.id}`);
      if (old) old.remove();

      const el = document.createElement('div');
      el.id = `hbox_${box.id}`;
      el.className = `hbox ${box.color || 'green'}`;
      el.style.cssText = `left:${box.x}px; top:${box.y}px; width:${box.width}px; height:${box.height}px;`;

      // Label tag
      const tag = document.createElement('div');
      tag.className = 'hbox-tag';
      tag.innerHTML = `<span>${box.label || ''}</span>`;

      // Close button
      const closeBtn = document.createElement('button');
      closeBtn.className = 'hbox-close';
      closeBtn.textContent = '✕';
      closeBtn.title = 'Close this highlight';
      closeBtn.addEventListener('click', () => {
        el.remove();
        ipcRenderer.invoke('agent:close-box', { id: box.id });
      });
      tag.appendChild(closeBtn);
      el.appendChild(tag);

      boxLayer.appendChild(el);
    });

    ipcRenderer.on('overlay:box-close', (_e, { id }) => {
      const el = document.getElementById(`hbox_${id}`);
      if (el) el.remove();
    });

    ipcRenderer.on('overlay:boxes-clear', () => {
      boxLayer.innerHTML = '';
    });

    // ── ScreenPad ────────────────────────────────────────────────────────────
    let padRequiresConfirmation = false;
    let padContent = '';

    ipcRenderer.on('overlay:screenpad-show', (_e, data) => {
      document.getElementById('sp-title-text').textContent = data.title || 'AI Suggestion';
      document.getElementById('sp-content').textContent    = data.content || '';
      padContent               = data.content || '';
      padRequiresConfirmation  = !!data.requiresConfirmation;

      const confirmBtn = document.getElementById('sp-confirm');
      if (padRequiresConfirmation) {
        confirmBtn.classList.remove('sp-btn-hidden');
      } else {
        confirmBtn.classList.add('sp-btn-hidden');
      }

      screenpad.classList.add('visible');
    });

    ipcRenderer.on('overlay:screenpad-close', () => {
      screenpad.classList.remove('visible');
    });

    // Close button
    document.getElementById('sp-close').addEventListener('click', () => {
      screenpad.classList.remove('visible');
      ipcRenderer.invoke('agent:close-screenpad');
    });

    // Copy button
    document.getElementById('sp-copy').addEventListener('click', () => {
      navigator.clipboard.writeText(padContent).catch(() => {
        // Fallback: select all text
        const el = document.getElementById('sp-content');
        const range = document.createRange();
        range.selectNodeContents(el);
        window.getSelection()?.removeAllRanges();
        window.getSelection()?.addRange(range);
        document.execCommand('copy');
      });
    });

    // Confirm & Save button (research output)
    document.getElementById('sp-confirm').addEventListener('click', async () => {
      const result = await ipcRenderer.invoke('agent:research-confirm', {
        content:  padContent,
        filename: `research_${Date.now()}.md`
      });
      if (result?.success) {
        statusText.textContent = `✅ Research saved to: ${result.path}`;
        screenpad.classList.remove('visible');
        ipcRenderer.invoke('agent:close-screenpad');
      }
    });
  </script>
</body>
</html>
