<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cup Work — Fast • Accuracy • Low Cost</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #07080c;
      --card-bg: rgba(15, 17, 26, 0.88);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --cycle-duration: 6.8s; /* Slow, relaxing, smooth pace */
    }

    body {
      min-height: 100vh;
      width: 100vw;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 25%, rgba(255, 255, 255, 0.05) 0%, transparent 60%),
        radial-gradient(circle at 85% 85%, rgba(56, 189, 248, 0.03) 0%, transparent 55%),
        radial-gradient(circle at 15% 85%, rgba(168, 85, 247, 0.03) 0%, transparent 55%);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      user-select: none;
      padding: 24px;
    }

    /* Ambient Grid Background */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-size: 44px 44px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      mask-image: radial-gradient(ellipse at center, black 45%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 45%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    /* Main Presentation Container */
    .stage-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      max-width: 620px;
      width: 100%;
      animation: fadeInStage 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInStage {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ═════════════════════════════════════════════════════════════════════════
       ── BIG SCREEN COFFEE AVATAR ─────────────────────────────────────────────
       ═════════════════════════════════════════════════════════════════════════ */
    .avatar-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ambient Pulsing Glow Behind Avatar */
    .avatar-glow {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 45%, transparent 70%);
      filter: blur(32px);
      animation: pulseGlow 6s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes pulseGlow {
      0% {
        transform: scale(0.92);
        opacity: 0.45;
      }
      100% {
        transform: scale(1.14);
        opacity: 0.85;
      }
    }

    /* Circular Avatar Frame */
    .avatar-circle {
      position: relative;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: #18181b;
      border: 3.5px solid rgba(255, 255, 255, 0.15);
      box-shadow: 
        0 30px 80px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(255, 255, 255, 0.06),
        inset 0 2px 10px rgba(255, 255, 255, 0.12);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .avatar-circle:hover {
      transform: scale(1.035);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 
        0 36px 90px rgba(0, 0, 0, 0.85),
        0 0 40px rgba(255, 255, 255, 0.14);
    }

    .avatar-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ═════════════════════════════════════════════════════════════════════════
       ── SLOW, SMOOTH, RELAXING ANIMATIONS (6.8s CYCLE) ───────────────────────
       ═════════════════════════════════════════════════════════════════════════ */
    @keyframes slowArmDrinkMotion {
      0%, 20% {
        transform: translate(0px, 0px) rotate(0deg);
      }
      38%, 68% {
        transform: translate(-10px, -23px) rotate(-16deg);
      }
      84%, 100% {
        transform: translate(0px, 0px) rotate(0deg);
      }
    }

    @keyframes slowHeadSipMotion {
      0%, 20% {
        transform: rotate(0deg) translateY(0px);
      }
      38%, 68% {
        transform: rotate(4deg) translateY(-1px);
      }
      84%, 100% {
        transform: rotate(0deg) translateY(0px);
      }
    }

    /* Smooth Steam Dissipation */
    @keyframes slowSteamOne {
      0% {
        transform: translateY(0px) scale(0.8);
        opacity: 0;
      }
      25% {
        opacity: 0.85;
      }
      65% {
        opacity: 0.35;
      }
      100% {
        transform: translateY(-20px) scale(1.25);
        opacity: 0;
      }
    }

    @keyframes slowSteamTwo {
      0% {
        transform: translateY(0px) scale(0.8);
        opacity: 0;
      }
      30% {
        opacity: 0.75;
      }
      70% {
        opacity: 0.3;
      }
      100% {
        transform: translateY(-22px) scale(1.3);
        opacity: 0;
      }
    }

    /* ── EYES: OPEN EYE BLINKING & COFFEE SIP SQUINTING ── */
    @keyframes openEyesCycle {
      0%, 15% {
        opacity: 1;
        transform: scaleY(1);
      }
      16% {
        transform: scaleY(0.1);
      }
      18% {
        transform: scaleY(1);
      }
      28% {
        opacity: 1;
      }
      36%, 70% {
        opacity: 0;
      }
      78%, 100% {
        opacity: 1;
        transform: scaleY(1);
      }
      88% {
        transform: scaleY(0.1);
      }
      90% {
        transform: scaleY(1);
      }
    }

    @keyframes sipEyesCycle {
      0%, 28% {
        opacity: 0;
        transform: scale(0.9);
      }
      36%, 68% {
        opacity: 1;
        transform: scale(1);
      }
      76%, 100% {
        opacity: 0;
        transform: scale(0.9);
      }
    }

    .person-arm-cup {
      transform-origin: 28px 84px;
      animation: slowArmDrinkMotion var(--cycle-duration) cubic-bezier(0.42, 0, 0.58, 1) infinite;
    }

    .person-head {
      transform-origin: 50px 58px;
      animation: slowHeadSipMotion var(--cycle-duration) cubic-bezier(0.42, 0, 0.58, 1) infinite;
    }

    .steam-wisp-1 {
      transform-origin: 59px 63px;
      animation: slowSteamOne 3.2s ease-out infinite;
    }

    .steam-wisp-2 {
      transform-origin: 64px 63px;
      animation: slowSteamTwo 3.6s ease-out 1.2s infinite;
    }

    .open-eyes-group {
      transform-origin: 50px 40px;
      animation: openEyesCycle var(--cycle-duration) ease-in-out infinite;
    }

    .sip-eyes-group {
      transform-origin: 50px 40px;
      animation: sipEyesCycle var(--cycle-duration) ease-in-out infinite;
    }

    /* ═════════════════════════════════════════════════════════════════════════
       ── CUP WORK BADGING & CLEAN BRANDING ────────────────────────────────────
       ═════════════════════════════════════════════════════════════════════════ */
    .branding-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      padding: 24px 36px 26px;
      border-radius: 26px;
      box-shadow: 
        0 24px 50px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: all 0.3s ease;
      width: 100%;
    }

    .branding-card:hover {
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateY(-2px);
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.6),
        0 0 30px rgba(255, 255, 255, 0.04);
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Cup Work White Vector Icon */
    .cup-icon-svg {
      width: 32px;
      height: 32px;
      color: #ffffff;
      filter: drop-shadow(0 2px 8px rgba(255, 255, 255, 0.25));
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }

    .brand-tagline {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-tagline::before, .brand-tagline::after {
      content: "";
      width: 20px;
      height: 1px;
      background: rgba(255, 255, 255, 0.14);
    }

    /* ═════════════════════════════════════════════════════════════════════════
       ── CLEAN PILL BADGES: FAST • ACCURACY • LOW COST (NO EMOJIS) ────────────
       ═════════════════════════════════════════════════════════════════════════ */
    .value-props-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .prop-pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      transition: all 0.2s ease;
    }

    .prop-pill:hover {
      transform: translateY(-1.5px);
      background: rgba(255, 255, 255, 0.08);
    }

    .prop-pill.fast {
      border-color: rgba(56, 189, 248, 0.35);
      background: rgba(56, 189, 248, 0.08);
      color: #7dd3fc;
    }
    .prop-pill.fast:hover {
      background: rgba(56, 189, 248, 0.16);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
    }

    .prop-pill.accuracy {
      border-color: rgba(52, 211, 153, 0.35);
      background: rgba(52, 211, 153, 0.08);
      color: #6ee7b7;
    }
    .prop-pill.accuracy:hover {
      background: rgba(52, 211, 153, 0.16);
      box-shadow: 0 0 16px rgba(52, 211, 153, 0.25);
    }

    .prop-pill.low-cost {
      border-color: rgba(251, 191, 36, 0.35);
      background: rgba(251, 191, 36, 0.08);
      color: #fde047;
    }
    .prop-pill.low-cost:hover {
      background: rgba(251, 191, 36, 0.16);
      box-shadow: 0 0 16px rgba(251, 191, 36, 0.25);
    }

    /* Screen Responsiveness */
    @media (max-width: 640px) {
      .avatar-circle {
        width: 260px;
        height: 260px;
      }
      .avatar-glow {
        width: 300px;
        height: 300px;
      }
      .brand-title {
        font-size: 26px;
      }
      .cup-icon-svg {
        width: 26px;
        height: 26px;
      }
      .branding-card {
        padding: 20px 24px;
      }
    }
  </style>
</head>
<body>

  <!-- Background Ambient Grid -->
  <div class="bg-grid"></div>

  <!-- Center Stage Presentation -->
  <main class="stage-container">

    <!-- Big Screen Animated Coffee Avatar -->
    <div class="avatar-wrapper">
      <div class="avatar-glow"></div>
      
      <div class="avatar-circle">
        <svg
          viewBox="0 0 100 100"
          class="avatar-svg"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="Cup Work Coffee Sipping Avatar"
        >
          <defs>
            <clipPath id="avatar-circle-clip">
              <circle cx="50" cy="50" r="49" />
            </clipPath>
          </defs>

          <!-- Background Disc -->
          <rect width="100" height="100" fill="#18181b" />

          <g clipPath="url(#avatar-circle-clip)">
            <!-- Ambient subtle backdrop halo -->
            <circle cx="50" cy="35" r="32" fill="#ffffff" opacity="0.04" />

            <!-- Torso / Dark Sweater -->
            <path
              d="M 18 100 C 22 75, 34 67, 50 67 C 66 67, 78 75, 82 100 Z"
              fill="#27272a"
              stroke="#3f3f46"
              strokeWidth="1.5"
            />
            <!-- Sweater Collar -->
            <path d="M 42 67 Q 50 75 58 67" fill="none" stroke="#52525b" strokeWidth="1.5" />

            <!-- Head & Face Group (Synchronized gentle nod/tilt) -->
            <g class="person-head">
              <!-- Neck -->
              <rect x="45" y="54" width="10" height="14" rx="3" fill="#e4e4e7" />

              <!-- Head / Face Base -->
              <circle cx="50" cy="40" r="18" fill="#f4f4f5" />

              <!-- Hair Base -->
              <path
                d="M 32 38 C 32 23, 68 23, 68 38 C 68 30, 62 25, 50 25 C 38 25, 33 30, 32 38 Z"
                fill="#27272a"
              />
              <!-- Hair Bangs / Front Styling -->
              <path
                d="M 33 36 Q 44 29 54 35 Q 62 30 67 37 Q 60 25 50 25 Q 38 25 33 36 Z"
                fill="#27272a"
              />

              <!-- Eyebrows -->
              <path
                d="M 40 33 Q 44 31 48 33"
                stroke="#52525b"
                strokeWidth="1.4"
                fill="none"
                strokeLinecap="round"
              />
              <path
                d="M 52 33 Q 56 31 60 33"
                stroke="#52525b"
                strokeWidth="1.4"
                fill="none"
                strokeLinecap="round"
              />

              <!-- ══════════════════════════════════════════════════════
                   ── 1. EXPRESSIVE OPEN EYES (WITH BLINK & SHINE) ────
                   ══════════════════════════════════════════════════════ -->
              <g class="open-eyes-group">
                <!-- Left Eye -->
                <circle cx="44" cy="39.5" r="2.8" fill="#18181b" />
                <circle cx="43.2" cy="38.7" r="1.0" fill="#ffffff" />
                <circle cx="45.1" cy="40.5" r="0.5" fill="#ffffff" />

                <!-- Right Eye -->
                <circle cx="56" cy="39.5" r="2.8" fill="#18181b" />
                <circle cx="55.2" cy="38.7" r="1.0" fill="#ffffff" />
                <circle cx="57.1" cy="40.5" r="0.5" fill="#ffffff" />
              </g>

              <!-- ══════════════════════════════════════════════════════
                   ── 2. SATISFIED SIPPING SQUINT ARCS (DURING DRINK) ──
                   ══════════════════════════════════════════════════════ -->
              <g class="sip-eyes-group">
                <!-- Left Smiling Eye Arc -->
                <path
                  d="M 41 40.5 Q 44 37 47 40.5"
                  stroke="#18181b"
                  strokeWidth="1.9"
                  fill="none"
                  strokeLinecap="round"
                />
                <!-- Right Smiling Eye Arc -->
                <path
                  d="M 53 40.5 Q 56 37 59 40.5"
                  stroke="#18181b"
                  strokeWidth="1.9"
                  fill="none"
                  strokeLinecap="round"
                />
              </g>

              <!-- Nose -->
              <path
                d="M 50 40.5 L 49 44.5 L 52 44.5"
                stroke="#a1a1aa"
                strokeWidth="1.2"
                fill="none"
                strokeLinecap="round"
              />

              <!-- Gentle Content Smile -->
              <path
                d="M 46 48 Q 50 51.5 54 48"
                stroke="#71717a"
                strokeWidth="1.6"
                fill="none"
                strokeLinecap="round"
              />
            </g>

            <!-- Arm & Coffee Mug Group (Slow Sipping Motion) -->
            <g class="person-arm-cup">
              <!-- Sleeve -->
              <path d="M 22 84 Q 36 78 52 74 Q 44 88 26 94 Z" fill="#3f3f46" />

              <!-- Hand Holding Mug -->
              <circle cx="56" cy="73" r="4.5" fill="#f4f4f5" stroke="#3f3f46" strokeWidth="1" />

              <!-- Steam Wisps Rising from Mug -->
              <path
                class="steam-wisp-1"
                d="M 59 63 Q 57 56 60 50 Q 63 45 60 40"
                fill="none"
                stroke="#e4e4e7"
                strokeWidth="1.4"
                strokeLinecap="round"
              />
              <path
                class="steam-wisp-2"
                d="M 64 63 Q 67 55 64 49 Q 61 43 65 38"
                fill="none"
                stroke="#d4d4d8"
                strokeWidth="1.3"
                strokeLinecap="round"
              />

              <!-- Ceramic Coffee Mug (Clean White with Dark Stroke) -->
              <path
                d="M 54 66 L 70 66 Q 71 78 68 81 Q 57 82 56 81 Z"
                fill="#ffffff"
                stroke="#18181b"
                strokeWidth="1.5"
              />
              <!-- Mug Handle -->
              <path
                d="M 70 69 C 75 69, 75 77, 70 77"
                fill="none"
                stroke="#18181b"
                strokeWidth="1.5"
                strokeLinecap="round"
              />
              <!-- Hot Dark Roast Coffee Liquid Surface -->
              <ellipse cx="62" cy="66" rx="7" ry="2" fill="#27272a" />
            </g>
          </g>
        </svg>
      </div>
    </div>

    <!-- Cup Work Badging & Value Proposition Badges -->
    <div class="branding-card">
      <div class="logo-row">
        <!-- Cup Work White Coffee Cup Logo -->
        <svg class="cup-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 8h1a4 4 0 1 1 0 8h-1"></path>
          <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path>
          <line x1="6" y1="2" x2="6" y2="4"></line>
          <line x1="10" y1="2" x2="10" y2="4"></line>
          <line x1="14" y1="2" x2="14" y2="4"></line>
        </svg>

        <h1 class="brand-title">Cup Work</h1>
      </div>

      <div class="brand-tagline">Autonomous Desktop AI</div>

      <!-- Feature Highlights: Fast, Accuracy, Low Cost (Clean Minimalist Text) -->
      <div class="value-props-row">
        <div class="prop-pill fast">Fast</div>
        <div class="prop-pill accuracy">Accuracy</div>
        <div class="prop-pill low-cost">Low Cost</div>
      </div>
    </div>

  </main>

</body>
</html>
